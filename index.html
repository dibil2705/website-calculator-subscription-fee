<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Калькулятор</title>
  <style>
    :root{
      --bg:#070a12;
      --card1: rgba(255,255,255,.075);
      --card2: rgba(255,255,255,.035);
      --stroke: rgba(255,255,255,.12);
      --stroke2: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);

      --btn: rgba(255,255,255,.055);
      --btn2: rgba(255,255,255,.03);

      --accent: rgba(110,231,255,.14);
      --accentStroke: rgba(110,231,255,.32);

      --danger: rgba(255,120,120,.12);
      --dangerStroke: rgba(255,120,120,.35);

      --shadow: 0 28px 90px rgba(0,0,0,.65);
      --r: 24px;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding: 24px;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1100px 720px at 18% 12%, rgba(54, 170, 180, .28), transparent 58%),
        radial-gradient(900px 640px at 84% 66%, rgba(105, 80, 190, .26), transparent 60%),
        linear-gradient(180deg, #0b1320, var(--bg));
    }

    .app{
      width: min(540px, 100%);
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--card1), var(--card2));
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .top{
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--stroke2);
      display:grid;
      gap: 12px;
    }

    .row{
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .row.align-start{
      align-items:flex-start;
    }

    .toggleGroup{
      display:flex;
      gap: 8px;
      width: 100%;
    }

    .toggleGroup .btn{
      flex: 1;
    }

    .btn.active{
      border-color: var(--accentStroke);
      background: linear-gradient(180deg, rgba(110,231,255,.18), rgba(110,231,255,.08));
    }

    .pill{
      flex: 1;
      border: 1px solid var(--stroke2);
      background: rgba(0,0,0,.22);
      border-radius: 18px;
      padding: 12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      min-height: 62px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        inset 0 -1px 0 rgba(0,0,0,.25);
    }

    .label{ font-size: 12px; color: var(--muted); }
    .big{ font-size: 22px; font-weight: 850; letter-spacing: .2px; }

    .rateBox{
      display:flex;
      align-items:center;
      gap: 10px;
      justify-content:flex-end;
    }

    .rateBox .btn{
      min-width: 56px;
    }

    input{
      width: 110px;
      border: 1px solid var(--stroke2);
      border-radius: 14px;
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 10px 10px;
      font-size: 16px;
      font-weight: 800;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    input[readonly]{
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn{
      appearance:none;
      border: 1px solid var(--stroke2);
      background: linear-gradient(180deg, var(--btn), var(--btn2));
      color: var(--text);
      border-radius: 16px;
      padding: 12px 10px;
      font-size: 16px;
      font-weight: 850;
      cursor:pointer;
      user-select:none;
      transition: transform .06s ease, filter .15s ease, background .15s ease, border-color .15s ease;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -1px 0 rgba(0,0,0,.35);
    }
    .btn:hover{ filter: brightness(1.06); }
    .btn:active{ transform: translateY(1px); }

    .accent{ border-color: var(--accentStroke); background: linear-gradient(180deg, rgba(110,231,255,.16), rgba(110,231,255,.06)); }
    .danger{ border-color: var(--dangerStroke); background: linear-gradient(180deg, rgba(255,120,120,.14), rgba(255,120,120,.06)); }

    .formulaWrap{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap:wrap;
    }
    .code{
      border: 1px solid var(--stroke2);
      background: rgba(0,0,0,.22);
      padding: 8px 10px;
      border-radius: 999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: rgba(255,255,255,.85);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px;
    }

    .wide{ grid-column: span 2; }
    .ghost{ opacity:.45; cursor:not-allowed; }

    .screenNums{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 14px;
      width: 100%;
      flex-wrap: wrap;
    }
    .stack{ display:flex; flex-direction:column; gap: 4px; }
    .right{ text-align:right; }

    details{
      width: 100%;
      border: 1px solid var(--stroke2);
      border-radius: 16px;
      padding: 10px 12px;
      background: rgba(0,0,0,.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    details summary{
      cursor: pointer;
      list-style: none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    details summary::-webkit-details-marker{ display:none; }

    .detailsGrid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .detailsGrid .stack{
      gap: 6px;
    }

    .detailsGrid input{
      width: 100%;
    }

    .detailsButton{
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
    }

    .detailsButton summary{
      padding: 12px 10px;
      border-radius: 16px;
      border: 1px solid var(--stroke2);
      background: linear-gradient(180deg, var(--btn), var(--btn2));
      color: var(--text);
      font-size: 14px;
      font-weight: 850;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -1px 0 rgba(0,0,0,.35);
    }

    .detailsButton[open] summary{
      border-color: var(--accentStroke);
      background: linear-gradient(180deg, rgba(110,231,255,.16), rgba(110,231,255,.06));
    }

    .settingsList{
      display:grid;
      gap: 10px;
      margin-top: 12px;
    }

    .settingsList label{
      display:flex;
      gap: 10px;
      align-items:flex-start;
      font-size: 13px;
      color: var(--text);
      line-height: 1.35;
    }

    .pillColumn{
      display:flex;
      flex-direction:column;
      gap: 12px;
      width: 100%;
    }

    @media (max-width: 520px){
      body{ padding: 14px; }
      .top{ padding: 14px; }
      .row{
        flex-direction: column;
        align-items: stretch;
      }
      .toggleGroup{
        flex-direction: column;
      }
      .rateBox{
        width: 100%;
        justify-content: space-between;
      }
      .rateBox input{
        flex: 1;
        width: auto;
      }
      .formulaWrap{
        flex-direction: column;
        align-items: flex-start;
      }
      .code{
        width: 100%;
      }
      .detailsGrid{
        grid-template-columns: minmax(0, 1fr);
      }
      .grid{
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 14px;
      }
      .wide{ grid-column: span 3; }
      input{ width: 100%; }
      .big{ font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="row">
        <div class="toggleGroup" role="tablist" aria-label="Режим калькулятора">
          <button class="btn active" id="modeHospitality" type="button" data-mode="hospitality">Рестораны/отели</button>
          <button class="btn" id="modeOutbound" type="button" data-mode="outbound">Исходящие звонки</button>
        </div>
      </div>
      <div class="row">
        <div class="pill">
          <div class="pillColumn">
            <div class="row">
              <div class="stack">
                <div class="label">₽/мин</div>
                <div class="big" id="rateDisplay">20</div>
              </div>

              <div class="rateBox">
                <input id="rateInput" type="number" inputmode="decimal" min="0" step="0.01" value="20" aria-label="Цена за минуту">
                <button class="btn accent" id="rateSet" type="button" aria-label="Применить цену">OK</button>
              </div>
            </div>

            <div class="row align-start" id="outboundControls" hidden>
              <details id="rateDetails">
                <summary>
                  <span>Детализация ₽/мин</span>
                  <span aria-hidden="true">⌄</span>
                </summary>
                <div class="detailsGrid">
                  <label class="stack">
                    <span class="label">Синтез речи</span>
                    <input id="speechInput" type="number" inputmode="decimal" min="0" step="0.01" value="2.63">
                  </label>
                  <label class="stack">
                    <span class="label">Голосовой бот</span>
                    <input id="voiceInput" type="number" inputmode="decimal" min="0" step="0.01" value="4.5">
                  </label>
                  <label class="stack">
                    <span class="label">Токены</span>
                    <input id="tokenInput" type="number" inputmode="decimal" min="0" step="0.01" value="0.8">
                  </label>
                </div>
              </details>

              <div class="toggleGroup">
                <button class="btn" id="costButton" type="button">Себестоимость</button>
                <details id="settingsDetails" class="detailsButton">
                  <summary>
                    <span>Настройки</span>
                    <span aria-hidden="true">⚙️</span>
                  </summary>
                  <div class="settingsList" role="radiogroup" aria-label="Тарифы">
                    <label><input type="radio" name="tariff" value="4.5" checked> 1500 мин/30 дней — 6 750 ₽ · 4,5 ₽/мин</label>
                    <label><input type="radio" name="tariff" value="4.1"> 3000 мин/30 дней — 12 300 ₽ · 4,1 ₽/мин</label>
                    <label><input type="radio" name="tariff" value="3.8"> 5000 мин/30 дней — 19 000 ₽ · 3,8 ₽/мин</label>
                    <label><input type="radio" name="tariff" value="3.5"> 7000 мин/30 дней — 24 500 ₽ · 3,5 ₽/мин</label>
                    <label><input type="radio" name="tariff" value="3.4"> 10 000 мин/30 дней — 34 000 ₽ · 3,4 ₽/мин</label>
                    <label><input type="radio" name="tariff" value="3.3"> 20 000 мин/60 дней — 66 000 ₽ · 3,3 ₽/мин</label>
                    <label><input type="radio" name="tariff" value="3.2"> 35 000 мин/60 дней — 112 000 ₽ · 3,2 ₽/мин</label>
                    <label><input type="radio" name="tariff" value="3.0"> 50 000 мин/60 дней — 150 000 ₽ · 3 ₽/мин</label>
                  </div>
                </details>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="formulaWrap">
        <div class="label">Формула</div>
        <div class="code" id="formula" title="Полная формула"></div>
      </div>

      <div class="row">
        <div class="pill">
          <div class="screenNums">
            <div class="stack">
              <div class="label" id="nLabel">n — звонки</div>
              <div class="big" id="nDisplay">0</div>
            </div>
            <div class="stack right">
              <div class="label">итог</div>
              <div class="big" id="sumDisplay">—</div>
            </div>
            <div class="stack right">
              <div class="label">прибыль</div>
              <div class="big" id="profitDisplay">—</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid" id="keys">
      <button type="button" class="btn danger wide" data-action="clear">C</button>
      <button type="button" class="btn danger" data-action="back">⌫</button>
      <button type="button" class="btn ghost" disabled aria-hidden="true"></button>

      <button type="button" class="btn" data-digit="7">7</button>
      <button type="button" class="btn" data-digit="8">8</button>
      <button type="button" class="btn" data-digit="9">9</button>
      <button type="button" class="btn ghost" disabled aria-hidden="true"></button>

      <button type="button" class="btn" data-digit="4">4</button>
      <button type="button" class="btn" data-digit="5">5</button>
      <button type="button" class="btn" data-digit="6">6</button>
      <button type="button" class="btn ghost" disabled aria-hidden="true"></button>

      <button type="button" class="btn" data-digit="1">1</button>
      <button type="button" class="btn" data-digit="2">2</button>
      <button type="button" class="btn" data-digit="3">3</button>
      <button type="button" class="btn ghost" disabled aria-hidden="true"></button>

      <button type="button" class="btn wide" data-digit="0">0</button>
      <button type="button" class="btn accent wide" data-action="equals">=</button>
    </div>
  </div>

  <script>
    (() => {
      const nDisplay = document.getElementById('nDisplay');
      const nLabel = document.getElementById('nLabel');
      const sumDisplay = document.getElementById('sumDisplay');
      const profitDisplay = document.getElementById('profitDisplay');
      const keys = document.getElementById('keys');

      const modeHospitality = document.getElementById('modeHospitality');
      const modeOutbound = document.getElementById('modeOutbound');

      const rateDisplay = document.getElementById('rateDisplay');
      const rateInput = document.getElementById('rateInput');
      const rateSet = document.getElementById('rateSet');

      const outboundControls = document.getElementById('outboundControls');
      const rateDetails = document.getElementById('rateDetails');
      const speechInput = document.getElementById('speechInput');
      const voiceInput = document.getElementById('voiceInput');
      const tokenInput = document.getElementById('tokenInput');
      const costButton = document.getElementById('costButton');
      const settingsDetails = document.getElementById('settingsDetails');
      const tariffInputs = Array.from(document.querySelectorAll('input[name="tariff"]'));

      const formulaEl = document.getElementById('formula');

      let nStr = "0";
      let rate = 20;
      let lastManualRate = rate;
      let mode = "hospitality";
      let costEnabled = false;

      const BASE = 1200 + 500;
      const BASE_OUTBOUND_COST = 1200 * 0.6 + 500 * 0.8;
      const MULT_FIXED = 3 * 31;

      const fmt = (x) => new Intl.NumberFormat("ru-RU").format(x);
      const fmtRate = (x) => new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(x);

      const parseNumber = (value, fallback = 0) => {
        const v = Number.parseFloat(value);
        return Number.isFinite(v) ? v : fallback;
      };

      const getDetailedRate = () => {
        const speech = parseNumber(speechInput.value, 0);
        const voice = parseNumber(voiceInput.value, 0);
        const tokens = parseNumber(tokenInput.value, 0);
        return speech + voice * 0.8 + tokens;
      };

      const renderRate = (value) => {
        rateDisplay.textContent = fmtRate(value);
        rateInput.value = String(value);
      };

      const renderFormula = () => {
        if (mode === "outbound") {
          const rateIsDetailed = costEnabled && rateDetails.open;
          const usedRate = rateIsDetailed ? getDetailedRate() : rate;
          const rateLabel = fmtRate(usedRate);
          if (costEnabled) {
            const speech = fmtRate(parseNumber(speechInput.value, 0));
            const voice = fmtRate(parseNumber(voiceInput.value, 0));
            const tokens = fmtRate(parseNumber(tokenInput.value, 0));
            const breakdown = rateIsDetailed
              ? `(${speech} + ${voice} × 0,8 + ${tokens} = ${rateLabel})`
              : rateLabel;
            formulaEl.textContent = `1200 - 40% + 500 - 20% + n × ${breakdown} × 3`;
          } else {
            formulaEl.textContent = `1200 + 500 + n × ${rateLabel} × 3`;
          }
        } else {
          formulaEl.textContent = `1200 + 500 + n × ${fmtRate(rate)} × 3 × 31`;
        }
        formulaEl.title = formulaEl.textContent;
      };

      function normalizeN(){
        nStr = nStr.replace(/^0+(?=\d)/, "");
        if (!nStr) nStr = "0";
      }
      function renderN(){ nDisplay.textContent = nStr; }

      function appendDigit(d){
        nStr = (nStr === "0") ? d : (nStr + d);
        normalizeN(); renderN();
      }
      function backspace(){
        nStr = (nStr.length <= 1) ? "0" : nStr.slice(0, -1);
        normalizeN(); renderN();
      }
      function clearAll(){
        nStr = "0"; renderN();
        sumDisplay.textContent = "—";
        profitDisplay.textContent = "—";
      }
      function compute(){
        const n = Number.parseInt(nStr, 10) || 0;
        const usedRate = mode === "outbound"
          ? (costEnabled && rateDetails.open ? getDetailedRate() : rate)
          : rate;
        const base = mode === "outbound"
          ? (costEnabled ? BASE_OUTBOUND_COST : BASE)
          : BASE;
        const total = base + n * usedRate * MULT_FIXED;
        sumDisplay.textContent = fmt(total);
        if (mode === "outbound") {
          const cost = BASE_OUTBOUND_COST + n * getDetailedRate() * MULT_FIXED;
          profitDisplay.textContent = fmt(total - cost);
        } else {
          profitDisplay.textContent = "—";
        }
      }

      function setRateFromInput(){
        const v = parseNumber(rateInput.value, 20);
        rate = v >= 0 ? v : 20;
        lastManualRate = rate;
        renderRate(rate);
        renderFormula();
      }

      rateSet.addEventListener('click', setRateFromInput);
      rateInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') setRateFromInput(); });

      keys.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || btn.disabled) return;

        const digit = btn.getAttribute('data-digit');
        const action = btn.getAttribute('data-action');

        if (digit !== null) appendDigit(digit);
        else if (action === "back") backspace();
        else if (action === "clear") clearAll();
        else if (action === "equals") compute();
      });

      window.addEventListener('keydown', (e) => {
        if (e.target === rateInput) return;
        if (e.key >= '0' && e.key <= '9') return appendDigit(e.key);
        if (e.key === 'Backspace') { e.preventDefault(); return backspace(); }
        if (e.key === 'Escape') return clearAll();
        if (e.key === 'Enter' || e.key === '=') return compute();
      });

      const setMode = (nextMode) => {
        mode = nextMode;
        const outbound = mode === "outbound";
        outboundControls.hidden = !outbound;
        settingsDetails.hidden = !outbound;
        modeHospitality.classList.toggle('active', !outbound);
        modeOutbound.classList.toggle('active', outbound);
        rateInput.step = outbound ? "0.01" : "1";
        rateInput.readOnly = outbound && costEnabled && rateDetails.open;
        rateSet.disabled = outbound && costEnabled && rateDetails.open;
        nLabel.textContent = outbound ? "n — всего звонков" : "n — звонков в день";
        renderRate(rate);
        renderFormula();
        sumDisplay.textContent = "—";
        profitDisplay.textContent = "—";
      };

      const syncDetailedRate = () => {
        const detailedRate = getDetailedRate();
        rate = detailedRate;
        renderRate(detailedRate);
        renderFormula();
      };

      const setCostState = (nextState) => {
        costEnabled = nextState;
        costButton.classList.toggle('active', costEnabled);
        rateDetails.open = costEnabled;
        rateInput.readOnly = costEnabled;
        rateSet.disabled = costEnabled;
        if (costEnabled) {
          lastManualRate = rate;
          syncDetailedRate();
        } else {
          rate = lastManualRate;
          renderRate(rate);
          renderFormula();
        }
        sumDisplay.textContent = "—";
      };

      rateDetails.addEventListener('toggle', () => {
        if (mode !== "outbound") return;
        if (rateDetails.open === costEnabled) return;
        setCostState(rateDetails.open);
      });

      [speechInput, voiceInput, tokenInput].forEach((input) => {
        input.addEventListener('input', () => {
          if (mode === "outbound" && rateDetails.open) {
            syncDetailedRate();
          }
        });
      });

      costButton.addEventListener('click', () => {
        if (mode !== "outbound") return;
        const nextState = !costEnabled;
        if (nextState) {
          speechInput.value = "2.63";
          tokenInput.value = "0.8";
          const selectedTariff = tariffInputs.find((input) => input.checked);
          voiceInput.value = selectedTariff ? selectedTariff.value : "4.5";
        }
        setCostState(nextState);
      });

      tariffInputs.forEach((input) => {
        input.addEventListener('change', () => {
          voiceInput.value = input.value;
          if (mode === "outbound" && rateDetails.open) {
            syncDetailedRate();
          }
        });
      });

      modeHospitality.addEventListener('click', () => setMode("hospitality"));
      modeOutbound.addEventListener('click', () => setMode("outbound"));

      // init
      renderRate(rate);
      renderFormula();
      renderN();
      nLabel.textContent = "n — звонков в день";
    })();
  </script>
</body>
</html>
